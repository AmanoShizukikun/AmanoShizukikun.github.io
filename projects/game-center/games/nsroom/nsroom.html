<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長門櫻的房間 · 3D 沉浸式互動導覽 | Nagato Sakura's Room</title>
  <meta name="description" content="長門櫻日系動漫房間 3D 沉浸式互動導覽，自由 360 度探索溫馨臥室、櫻花吊飾、書桌工作區、書架收藏與晨曦光影。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Three.js and Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="RoomEnvironment.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <!-- Post-processing for anime outline effect -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
</head>
<body>
  <!-- 2D Canvas for falling sakura petals -->
  <canvas id="sakura-canvas"></canvas>

  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="sakura-loader">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
      </div>
      <h2 class="loading-title">長門櫻的房間</h2>
      <p class="loading-subtitle">正在載入 3D 空間與材質模型...</p>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <span id="progress-text" class="progress-text">0%</span>
    </div>
  </div>

  <!-- UI Overlay -->
  <div id="ui-overlay" class="ui-overlay">
    <!-- Header -->
    <header class="top-header">
      <div class="branding">
        <span class="sakura-badge">🌸 櫻花和風部屋</span>
        <h1 class="main-title">長門櫻的房間 <span class="en-sub">Nagato Sakura's Room</span></h1>
      </div>
      <div class="header-actions">
        <button id="btn-soundtrack" class="icon-btn" title="切換房間治癒白噪音">
          <span class="icon">🎵</span>
          <span class="btn-text">BGM</span>
        </button>
        <button id="btn-help" class="icon-btn" title="查看操作說明">
          <span class="icon">❓</span>
          <span class="btn-text">指南</span>
        </button>
      </div>
    </header>

    <!-- Hotspot Info Modal -->
    <div id="hotspot-modal" class="hotspot-modal hidden">
      <div class="modal-card">
        <button id="modal-close" class="modal-close" aria-label="關閉卡片">&times;</button>
        <div class="modal-badge" id="modal-badge">細節展示</div>
        <h3 id="modal-title" class="modal-title">物件名稱</h3>
        <p id="modal-desc" class="modal-desc">物件說明與工藝介紹。</p>
        <div class="modal-footer">
          <button id="modal-focus-btn" class="btn-primary">近距離鏡頭鎖定</button>
        </div>
      </div>
    </div>

    <!-- Help Overlay Modal -->
    <div id="help-modal" class="help-modal hidden">
      <div class="help-card">
        <button id="help-close" class="modal-close" aria-label="關閉指南">&times;</button>
        <h3>🧭 3D 房間導覽操作指南</h3>
        <ul class="help-list">
          <li><span class="key">滑鼠左鍵拖曳</span> 或 <span class="key">單指滑動</span>：360 度旋轉視角</li>
          <li><span class="key">滾輪滾動</span> 或 <span class="key">雙指縮放</span>：無級鏡頭縮放</li>
          <li><span class="key">滑鼠右鍵拖曳</span> 或 <span class="key">雙指拖動</span>：平移觀察位置</li>
          <li><span class="key">點擊亮點標記 📍</span>：自動飛躍至目標並查看詳細介紹</li>
          <li><span class="key">底部導覽欄</span>：一鍵切換經典角度與晨曦/夕陽/夜景氛圍</li>
        </ul>
        <button id="help-confirm-btn" class="btn-primary">開始參觀</button>
      </div>
    </div>

    <!-- Interactive 3D Hotspot DOM Elements (dynamically tracked) -->
    <div id="hotspots-layer" class="hotspots-layer"></div>

    <!-- Bottom Control Dock -->
    <nav class="bottom-dock" aria-label="導覽控制列">
      <!-- Camera Presets -->
      <div class="dock-section views-section">
        <span class="section-label">導覽視角</span>
        <div class="pills-group" id="views-group">
          <button class="pill-btn active" data-view="iso" id="view-iso">
            <span class="btn-icon">🏠</span>
            <span class="btn-label">全景原畫</span>
          </button>
          <button class="pill-btn" data-view="charm" id="view-charm">
            <span class="btn-icon">🌸</span>
            <span class="btn-label">櫻花吊飾</span>
          </button>
          <button class="pill-btn" data-view="bed" id="view-bed">
            <span class="btn-icon">🛏️</span>
            <span class="btn-label">櫻花大床</span>
          </button>
          <button class="pill-btn" data-view="desk" id="view-desk">
            <span class="btn-icon">💻</span>
            <span class="btn-label">書桌工作區</span>
          </button>
          <button class="pill-btn" data-view="bookshelf" id="view-bookshelf">
            <span class="btn-icon">📚</span>
            <span class="btn-label">書架收藏</span>
          </button>
          <button class="pill-btn" data-view="window" id="view-window">
            <span class="btn-icon">🪟</span>
            <span class="btn-label">窗台晨景</span>
          </button>
        </div>
      </div>

      <!-- Divider -->
      <div class="dock-divider"></div>

      <!-- Lighting & Time Mode -->
      <div class="dock-section lighting-section">
        <span class="section-label">時段氛圍</span>
        <div class="pills-group" id="lighting-group">
          <button class="pill-btn active" data-light="morning" id="light-morning" title="晨曦金色暖陽">
            <span class="btn-icon">☀️</span>
            <span class="btn-label">晨曦</span>
          </button>
          <button class="pill-btn" data-light="sunset" id="light-sunset" title="夕陽溫暖餘暉">
            <span class="btn-icon">🌅</span>
            <span class="btn-label">夕照</span>
          </button>
          <button class="pill-btn" data-light="night" id="light-night" title="靜謐溫馨夜景">
            <span class="btn-icon">🌙</span>
            <span class="btn-label">夜色</span>
          </button>
        </div>
      </div>

      <!-- Divider -->
      <div class="dock-divider"></div>

      <!-- Feature Toggles -->
      <div class="dock-section features-section">
        <span class="section-label">特效輔助</span>
        <div class="pills-group">
          <button class="pill-btn toggle-btn" id="btn-auto-rotate" title="開關展台自動旋轉">
            <span class="btn-icon">🔄</span>
            <span class="btn-label">旋轉</span>
          </button>
          <button class="pill-btn toggle-btn active" id="btn-sakura-rain" title="開關櫻花花瓣飄落">
            <span class="btn-icon">🌸</span>
            <span class="btn-label">櫻花雨</span>
          </button>
          <button class="pill-btn toggle-btn active" id="btn-toggle-hotspots" title="開關細節熱點標記">
            <span class="btn-icon">📍</span>
            <span class="btn-label">標記</span>
          </button>
          <button class="pill-btn toggle-btn" id="btn-outline" title="開關二次元描邊（MiSide 風格）">
            <span class="btn-icon">✏️</span>
            <span class="btn-label">描邊</span>
          </button>
          <button class="pill-btn" id="btn-reset-view" title="重設鏡頭至初始視角">
            <span class="btn-icon">🎯</span>
            <span class="btn-label">重置</span>
          </button>
        </div>
      </div>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
